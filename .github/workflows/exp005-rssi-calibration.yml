name: LABO measured smartphone BLE RSS calibration

on:
  pull_request:
    paths:
      - 'scripts/exp005_rssi_calibrate.py'
      - 'scripts/exp005_calibration_compare.py'
      - 'scripts/test_exp005_rssi_calibrate.py'
      - 'src/**'
      - '.github/workflows/exp005-rssi-calibration.yml'
      - 'docs/EXP-005-RSSI-CALIBRATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labo-rssi-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Offline regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_exp005_rssi_calibrate.py' -v
          cargo test --all-targets

  calibration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch six published phone campaigns and verify MD5
        run: |
          python3 scripts/exp005_rssi_calibrate.py \
            --download --input-dir results/raw-rssi \
            --output results/phone-fits \
            --verify-snapshot docs/EXP-005-MEASURED-RSSI-COEFFICIENTS.csv
      - name: Preserve reproducible coefficients, not source raw data
        uses: actions/upload-artifact@v4
        with:
          name: labo-measured-rssi-fits
          path: results/phone-fits/
          if-no-files-found: error

  compare:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: labo-measured-rssi-fits
          path: results/phone-fits
      - name: Build LABO independent simulator
        run: cargo build --release
      - name: Compare phone-specific profiles against same simulated devices
        run: |
          python3 scripts/exp005_calibration_compare.py \
            --profiles results/phone-fits/profiles.json \
            --binary target/release/labo \
            --output results/phone-comparison
      - name: Store comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: labo-measured-rssi-synthetic-contrast
          path: results/phone-comparison/
          if-no-files-found: error
