name: LABO CAUSAL-02 reference vs optimized
on:
  pull_request:
    paths:
      - 'experiments/causal01-mail-time/**'
      - '.github/workflows/causal02-perf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/causal01-mail-time
    steps:
      - uses: actions/checkout@v4
      - name: All causal safety and differential tests
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Reference vs optimized timings
        run: |
          mkdir -p results
          target/release/labo-causal01-mail-time --benchmark | tee results/benchmark.txt
      - name: Original 21-cell acceptance
        run: |
          target/release/labo-causal01-mail-time > results/raw.jsonl
          python3 aggregate.py results/raw.jsonl results
      - name: Isolated process RSS by cache strategy
        run: |
          for size in 300 1200; do
            for mode in incremental bounded0 bounded32 bounded256 lru32 lru256; do
              /usr/bin/time -f "RSS mode=$mode rows=$size maxrss_kb=%M elapsed_s=%e" \
                -o "results/rss-$mode-$size.txt" \
                target/release/labo-causal01-mail-time --memory-benchmark "$mode" "$size" \
                > "results/memory-$mode-$size.txt"
              cat "results/memory-$mode-$size.txt" "results/rss-$mode-$size.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: labo-causal02-perf-differential
          path: experiments/causal01-mail-time/results/
          if-no-files-found: error
