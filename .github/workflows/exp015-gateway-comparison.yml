name: LABO EXP-015 gateway comparison
on:
  pull_request:
    paths:
      - 'scripts/exp015_gateway_comparison.py'
      - 'scripts/test_exp015_gateway_comparison.py'
      - 'scripts/exp018_gateway_recovery.py'
      - 'scripts/test_exp018_gateway_recovery.py'
      - 'scripts/exp018_measured_outages.py'
      - 'scripts/test_exp018_measured_outages.py'
      - 'research/EXP-018-RECOVERY-REPLAY.md'
      - 'research/EXP-018-W4-EVENT-HANDOFF.md'
      - 'scripts/exp008_recipient_routes.py'
      - 'scripts/exp017_route_choice.py'
      - 'scripts/test_exp017_route_choice.py'
      - '.github/workflows/exp015-gateway-comparison.yml'
      - 'research/EXP-015-GATEWAY-FIRST.md'
      - 'research/EXP-017-GATEWAY-DECISION.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labo-exp015-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measured-contact-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test assumptions, chronology, quota and false delivery
        run: |
          python3 -m unittest discover -s scripts -p 'test_exp015_gateway_comparison.py' -v
          python3 -m unittest discover -s scripts -p 'test_exp017_route_choice.py' -v
          python3 -m unittest discover -s scripts -p 'test_exp018_gateway_recovery.py' -v
          python3 -m unittest discover -s scripts -p 'test_exp018_measured_outages.py' -v
          python3 -m unittest discover -s scripts -p 'test_exp012_cross_environment.py' -v
      - name: Compare real CC0 contacts with assumed gateways
        run: |
          python3 scripts/exp015_gateway_comparison.py --download \
            --cache results/exp012-source-cache --output results/exp015 \
            --seeds 21021 21022 --gateway-percent 2 10 \
            --pickup-hours 1 2 --letters-per-kind 12 --ttl-hours 4
      - name: Derive paired nearest-gateway decisions from same observed contacts
        run: |
          python3 scripts/exp017_route_choice.py             --input results/exp015 --output results/exp017
      - name: Replay gateway outages and synthetic return paths on identical CC0 contacts
        run: |
          python3 scripts/exp018_measured_outages.py --download \
            --cache results/exp012-source-cache --output results/exp018 \
            --seeds 21021 21022 --gateway-percent 2 10 \
            --pickup-hours 1 2 --letters-per-kind 12 --ttl-hours 4
      - name: Verify independent environments and no duplicate counting
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          base=Path('results/exp015')
          record=json.loads((base/'gateway-comparison.json').read_text())
          rows=list(csv.DictReader((base/'gateway-routing.csv').open()))
          pairs=list(csv.DictReader((base/'paired-gateway-deltas.csv').open()))
          nearest=list(csv.DictReader((base/'paired-nearest-deltas.csv').open()))
          decision=json.loads(Path('results/exp017/route-decision.json').read_text())
          outage=json.loads(Path('results/exp018/outage-comparison.json').read_text())
          assert record['claim']=='real-human-encounters-synthetic-gateways-mailbox-and-routing'
          assert len(record['sources'])==2
          assert len(rows)==2*2*2*2*2*4*2,(len(rows))
          assert len(pairs)==2*2*2*2*2*3*2,(len(pairs))
          assert len(nearest)==2*2*2*2*2*2*2,(len(nearest))
          assert decision['claim']=='real-human-encounters-with-synthetic-gateway-policy-decision'
          assert outage['claim']=='measured-human-contact-times-with-synthetic-outages-and-w4-markers'
          assert len(outage['rows'])==2*2*2*2*5*2*2,len(outage['rows'])
          assert len(outage['pairs'])==2*2*2*2*5*2*2,len(outage['pairs'])
          assert len(outage['aggregates'])==2*2*2*5*2,len(outage['aggregates'])
          assert len(outage['pair_summary'])==2*2*2*5*2,len(outage['pair_summary'])
          event_path=Path('results/exp018/outage-message-events.csv')
          events=list(csv.DictReader(event_path.open()))
          assert len(events)==sum(int(r['messages']) for r in outage['rows']),len(events)
          assert {'message_ref','created_tick','recipient_stored_tick','source_confirmed_tick',
                  'gateway_deposit_events','distinct_gateway_nodes'}<=set(events[0])
          assert all(0<=int(e['distinct_gateway_nodes'])<=int(e['gateway_deposit_events'])
                     for e in events)
          assert not ({'sender','recipient','gateway_node'} & set(events[0]))
          assert all(not e['source_confirmed_tick'] or (
              e['recipient_stored_tick'] and
              int(e['source_confirmed_tick'])>int(e['recipient_stored_tick']))
              for e in events)
          assert all(int(r['source_confirmed'])<=int(r['recipient_stored'])<=int(r['messages']) for r in outage['rows'])
          assert all(int(r['max_copies'])<=4 and int(r['max_radio_ms_per_node_tick'])<=6000 for r in outage['rows'])
          assert all(int(p['messages'])==sum(int(p[k]) for k in ('both','only_direct','only_hybrid','neither')) for p in outage['pairs'])
          assert all(s['license']=='CC0-1.0' for s in outage['sources'].values())
          assert len(decision['aggregates'])==2*2*2*4
          assert len(decision['conditions'])==2*2*2
          assert all(n['against']=='gateway_history_prophet4' for n in nearest)
          assert all(int(n['messages'])==sum(int(n[k]) for k in
              ('both','only_test','only_nearest','neither')) for n in nearest)
          assert {r['policy'] for r in rows}=={
              'recipient_prophet4','gateway_direct4',
              'gateway_history_prophet4','hybrid_parallel4'}
          assert all(int(r['accepted']) <= int(r['messages']) for r in rows)
          assert all(int(r['max_copies_seen']) <= 4 for r in rows)
          assert all(int(r['max_airtime_ms_per_node_tick'])<=6000 for r in rows)
          assert all(int(r['accepted']) ==
              int(r['accepted_contact'])+int(r['accepted_mailbox']) for r in rows)
          assert all(int(r['messages']) == sum(int(r[k]) for k in
              ('both','only_test','only_prophet','neither')) for r in pairs)
          assert all(x['license']=='CC0-1.0' for x in record['sources'].values())
          print('EXP015_VERIFIED',len(rows),'rows',len(pairs),'paired',
                len(nearest),'nearest-paired',len(decision['conditions']),'decision-cells')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: labo-exp015-gateway-routing
          path: |
            results/exp015/gateway-routing.csv
            results/exp015/paired-gateway-deltas.csv
            results/exp015/paired-nearest-deltas.csv
            results/exp017/route-decision.json
            results/exp017/route-decision.md
            results/exp015/gateway-comparison.json
            results/exp018/outage-runs.csv
            results/exp018/outage-pairs.csv
            results/exp018/outage-aggregates.csv
            results/exp018/outage-paired-summary.csv
            results/exp018/outage-message-events.csv
            results/exp018/outage-comparison.json
            results/exp018/outage-report.md
            results/exp015/report.md
          if-no-files-found: error
